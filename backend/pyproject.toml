[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renewable-operations-alpha"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
    "no_db: pure unit test that must not create or mutate the test database",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/models/*"]
