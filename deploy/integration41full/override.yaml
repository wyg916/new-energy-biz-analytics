name: renewable-integration41-full

x-full-environment: &full-environment
  RELEASE_VERSION: 4.1.0-integration-full.1
  EXPECTED_DATABASE_REVISION: integration_41_full_0001
  ACCEPTANCE_LABEL: INTEGRATION-4.1-FULL
  ACCEPTANCE_POSTGRES_DB: renewable_p5b
  RUNTIME_DATA_CLASSIFICATION: OPEN_SOURCE_DERIVED
  QUERY_ENGINE_MODE: DETERMINISTIC_ONLY
  SQLBOT_INCLUDED_IN_V4_RELEASE: "true"
  SQLBOT_ENGINE_ENABLED: "false"
  SQLBOT_RUNTIME_VERIFIED: "false"
  SQLBOT_PROVIDER_ELIGIBILITY: REGISTERED_NOT_ELIGIBLE

services:
  runtime-bootstrap:
    image: renewable-integration41-full-api:4.1.0-integration-full.1
    pull_policy: never
    environment: *full-environment

  vault-bootstrap:
    image: renewable-integration41-full-api:4.1.0-integration-full.1
    pull_policy: never
    environment: *full-environment

  migrate:
    image: renewable-integration41-full-api:4.1.0-integration-full.1
    pull_policy: never
    environment: *full-environment

  init:
    image: renewable-integration41-full-api:4.1.0-integration-full.1
    pull_policy: never
    command: ["python", "scripts/p4_entrypoint.py", "python", "scripts/prepare_integration41_full.py"]
    environment: *full-environment

  alert-receiver:
    image: renewable-integration41-full-api:4.1.0-integration-full.1
    pull_policy: never

  api:
    image: renewable-integration41-full-api:4.1.0-integration-full.1
    pull_policy: never
    environment:
      <<: *full-environment
      MODEL_GATEWAY_KIMI_BASE_URL: https://api.moonshot.cn/v1
      MODEL_GATEWAY_KIMI_MODEL_NAME: kimi-k2.6
      MODEL_GATEWAY_KIMI_CREDENTIAL_REF: file:///run/provider-credentials/kimi
      MODEL_GATEWAY_KIMI_ENABLED: "true"
      MODEL_GATEWAY_MIMO_BASE_URL: https://api.xiaomimimo.com/v1
      MODEL_GATEWAY_MIMO_MODEL_NAME: mimo-v2.5
      MODEL_GATEWAY_MIMO_CREDENTIAL_REF: file:///run/provider-credentials/mimo
      MODEL_GATEWAY_MIMO_ENABLED: "true"
      MODEL_GATEWAY_DEEPSEEK_BASE_URL: https://api.deepseek.com
      MODEL_GATEWAY_DEEPSEEK_MODEL_NAME: deepseek-v4-flash
      MODEL_GATEWAY_DEEPSEEK_CREDENTIAL_REF: file:///run/provider-credentials/deepseek
      MODEL_GATEWAY_DEEPSEEK_ENABLED: "true"
    volumes:
      - provider_credentials:/run/provider-credentials:ro

  web:
    image: renewable-integration41-full-web:4.1.0-integration-full.1
    pull_policy: never

networks:
  default:
    name: renewable-integration41-full-network

volumes:
  provider_credentials:
    external: true
    name: renewable-integration41-full-provider-credentials
