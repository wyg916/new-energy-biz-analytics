server {
  listen 443 ssl;
  listen 8446 ssl;
  server_name p5b.localhost localhost;
  ssl_certificate /run/p4-runtime/tls_cert.pem;
  ssl_certificate_key /run/p4-runtime/tls_key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  resolver 127.0.0.11 valid=10s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8446;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /oidc/callback {
    set $web_upstream web:80;
    proxy_pass http://$web_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /oidc/ {
    set $oidc_upstream oidc:8080;
    proxy_pass http://$oidc_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8446;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    set $web_upstream web:80;
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 80;
  return 301 https://$host:8446$request_uri;
}
