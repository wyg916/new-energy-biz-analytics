name: renewable-p5a-remediation

x-p5a-api-environment: &p5a-api-environment
  APP_ENV: preproduction
  DEBUG: "false"
  AUTO_BOOTSTRAP_DEMO_USERS: "false"
  SIMULATED_DATA_ONLY: "true"
  LOCAL_AUTH_ENABLED: "false"
  PRODUCTION_RELEASE_AUTHORIZED: "false"
  PUBLIC_BASE_URL: https://p5a.localhost:8445
  CORS_ORIGINS: https://p5a.localhost:8445
  TRUSTED_HOSTS: p5a.localhost,localhost,api,testserver
  RELEASE_VERSION: 5.0.0-p5a
  EXPECTED_DATABASE_REVISION: p5_0001
  ACCEPTANCE_POSTGRES_DB: renewable_p5a
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  DATABASE_POOL_TIMEOUT_SECONDS: "30"
  ACCEPTANCE_PUBLIC_BASE_URL: https://p5a.localhost:8445
  ACCEPTANCE_LABEL: P5A Remediation
  QUERY_ENGINE_MODE: SHADOW
  SQLBOT_INCLUDED_IN_V4_RELEASE: "false"
  SQLBOT_ENGINE_ENABLED: "false"
  SQLBOT_RUNTIME_VERIFIED: "false"
  CHATBI_READONLY_EXECUTION_ENABLED: "false"
  OIDC_ENABLED: "true"
  OIDC_PROVIDER_CODE: OIDC_PREPROD
  OIDC_ISSUER: https://p5a.localhost:8445/oidc/realms/chatbi
  OIDC_INTERNAL_BASE_URL: http://oidc:8080/oidc/realms/chatbi
  OIDC_CLIENT_ID: chatbi-web
  OIDC_REDIRECT_URI: https://p5a.localhost:8445/oidc/callback
  OIDC_SCOPES: openid profile email
  VAULT_ENABLED: "true"
  VAULT_ADDRESS: http://vault:8200
  VAULT_ROLE_ID_FILE: /run/p4-runtime/vault_role_id
  VAULT_SECRET_ID_FILE: /run/p4-runtime/vault_secret_id
  EXTERNAL_ALERT_ENABLED: "true"
  EXTERNAL_ALERT_WEBHOOK_URL: http://alert-receiver:8090/webhook
  EXTERNAL_ALERT_SIGNING_REFERENCE_NAME: preprod-webhook-signing
  PREPRODUCTION_EVIDENCE_ROOT: /app/data/preproduction-evidence
  SECRET_ENV_ALLOWLIST: ""

services:
  runtime-bootstrap:
    image: renewable-p5a-api:5.0.0-p5a
    pull_policy: never
    environment:
      ACCEPTANCE_PUBLIC_BASE_URL: https://p5a.localhost:8445
      ACCEPTANCE_LABEL: P5A Remediation

  db:
    image: renewable-p5a-postgres:16.14
    environment:
      POSTGRES_DB: renewable_p5a
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD_FILE: /run/p4-runtime/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U alpha -d renewable_p5a"]
      interval: 5s
      timeout: 3s
      retries: 30

  vault-permissions:
    image: hashicorp/vault:2.0.3

  vault:
    image: hashicorp/vault:2.0.3

  vault-bootstrap:
    image: renewable-p5a-api:5.0.0-p5a
    pull_policy: never

  db-prepare:
    image: renewable-p5a-postgres:16.14
    pull_policy: never
    command:
      - sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /run/p4-runtime/postgres_password)"
        psql -h db -U alpha -d renewable_p5a -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION alpha'

  migrate:
    image: renewable-p5a-migration:5.0.0-p5a
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment: *p5a-api-environment

  init:
    image: renewable-p5a-api:5.0.0-p5a
    pull_policy: never
    environment: *p5a-api-environment

  oidc:
    image: renewable-p5a-keycloak:26.7.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: p5a-admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/renewable_p5a
      KC_DB_USERNAME: alpha
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /oidc
      KC_HOSTNAME: https://p5a.localhost:8445/oidc
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO

  alert-receiver:
    image: renewable-p5a-alert-receiver:5.0.0-p5a
    build:
      context: ../..
      dockerfile: backend/Dockerfile

  api:
    image: renewable-p5a-api:5.0.0-p5a
    environment: *p5a-api-environment

  web:
    image: renewable-p5a-web:5.0.0-p5a

  proxy:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes: !override
      - ../production-acceptance/nginx.p5a.conf:/etc/nginx/conf.d/default.conf:ro
      - p4_runtime:/run/p4-runtime:ro
    ports: !override
      - "8085:80"
      - "8445:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header='Host: p5a.localhost' -q -O /dev/null https://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  backup:
    image: renewable-p5a-backup:16.14
    build:
      context: ../..
      dockerfile: deploy/preproduction/postgres.Dockerfile
    command:
      - sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /run/p4-runtime/postgres_password)"
        while true; do
          target="/backups/p5a-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump -h db -U alpha -d renewable_p5a --format=custom --no-owner --file="$$target"
          sha256sum "$$target" > "$$target.sha256"
          sleep 86400
        done

networks:
  default:
    name: renewable-p5a-remediation-network
