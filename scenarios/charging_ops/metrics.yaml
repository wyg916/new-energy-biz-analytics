{
  "metrics": [
    {"code": "charging_revenue", "name": "充电收入", "aliases": ["收入", "营收"], "expression": "electricity_fee_net_amount + service_fee_net_amount", "aggregation": "sum", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "quarter", "region", "city", "station"], "filters": ["completed_sessions_only"], "unit": "元", "format": "0.00", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["session_fact.electricity_fee_net_amount", "session_fact.service_fee_net_amount"]}},
    {"code": "service_fee_revenue", "name": "服务费收入", "aliases": ["服务费"], "expression": "SUM(service_fee_net_amount)", "aggregation": "sum", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": ["completed_sessions_only"], "unit": "元", "format": "0.00", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["session_fact.service_fee_net_amount"]}},
    {"code": "completed_order_count", "name": "完成订单数", "aliases": ["订单数", "完成单量"], "expression": "COUNT(DISTINCT session_id)", "aggregation": "count_distinct", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": ["completed_sessions_only"], "unit": "单", "format": "0", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["session_fact.session_id"]}},
    {"code": "charging_volume_kwh", "name": "充电量", "aliases": ["电量", "充电电量"], "expression": "SUM(energy_kwh)", "aggregation": "sum", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": ["completed_sessions_only"], "unit": "kWh", "format": "0.0000", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["session_fact.energy_kwh"]}},
    {"code": "energy_cost", "name": "电费成本", "aliases": ["电成本"], "expression": "SUM(energy_cost)", "aggregation": "sum", "grain": ["workspace", "period"], "time_field": "energy_cost_fact.cost_date", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "元", "format": "0.00", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["energy_cost_fact.energy_cost"]}},
    {"code": "variable_operating_cost", "name": "可变运营成本", "aliases": ["可变成本"], "expression": "SUM(amount WHERE is_variable)", "aggregation": "sum", "grain": ["workspace", "period"], "time_field": "operation_expense_fact.expense_date", "supported_dimensions": ["date", "week", "month", "region", "city", "station", "expense_type"], "filters": [{"field": "is_variable", "value": true}], "unit": "元", "format": "0.00", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["operation_expense_fact.amount", "operation_expense_fact.is_variable"]}},
    {"code": "gross_profit", "name": "经营毛利", "aliases": ["毛利"], "expression": "charging_revenue - energy_cost - variable_operating_cost", "aggregation": "derived", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "元", "format": "0.00", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"metrics": ["charging_revenue", "energy_cost", "variable_operating_cost"]}},
    {"code": "gross_margin", "name": "毛利率", "aliases": ["经营毛利率"], "expression": "gross_profit / charging_revenue", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "%", "format": "0.00%", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"metrics": ["gross_profit", "charging_revenue"]}},
    {"code": "avg_order_energy_kwh", "name": "单均充电量", "aliases": ["单均电量"], "expression": "charging_volume_kwh / completed_order_count", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "kWh/单", "format": "0.0000", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"metrics": ["charging_volume_kwh", "completed_order_count"]}},
    {"code": "revenue_per_kwh", "name": "度电收入", "aliases": ["每度电收入"], "expression": "charging_revenue / charging_volume_kwh", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "元/kWh", "format": "0.0000", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"metrics": ["charging_revenue", "charging_volume_kwh"]}},
    {"code": "cost_per_kwh", "name": "度电成本", "aliases": ["每度电成本"], "expression": "(energy_cost + variable_operating_cost) / charging_volume_kwh", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "元/kWh", "format": "0.0000", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"metrics": ["energy_cost", "variable_operating_cost", "charging_volume_kwh"]}},
    {"code": "station_utilization_rate", "name": "场站利用率", "aliases": ["利用率"], "expression": "charging_duration / available_connector_duration", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station"], "filters": [], "unit": "%", "format": "0.00%", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["session_fact.charging_duration_seconds", "station_dimension.connector_count"]}},
    {"code": "device_online_rate", "name": "设备在线率", "aliases": ["在线率"], "expression": "online_duration / observable_duration", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "status_event_fact.start_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station", "device"], "filters": [], "unit": "%", "format": "0.00%", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["status_event_fact.status", "status_event_fact.start_time"]}},
    {"code": "device_fault_rate", "name": "设备故障率", "aliases": ["故障率"], "expression": "fault_duration / observable_duration", "aggregation": "ratio", "grain": ["workspace", "period"], "time_field": "status_event_fact.start_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station", "device"], "filters": [], "unit": "%", "format": "0.00%", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["status_event_fact.status", "status_event_fact.start_time"]}},
    {"code": "active_user_count", "name": "活跃用户数", "aliases": ["活跃用户"], "expression": "COUNT(DISTINCT user_id)", "aggregation": "count_distinct", "grain": ["workspace", "period"], "time_field": "session_fact.settlement_time", "supported_dimensions": ["date", "week", "month", "region", "city", "station", "user_segment"], "filters": ["completed_sessions_only"], "unit": "人", "format": "0", "owner": "metric_owner", "version": "0.1.0", "status": "PUBLISHED", "permission_policy": {"scope": "authorized_station_scope"}, "lineage": {"fields": ["session_fact.user_id"]}}
  ]
}
